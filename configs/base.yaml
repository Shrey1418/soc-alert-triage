paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  artifacts_dir: artifacts

data:
  train_file: GUIDE_Train.csv
  test_file: GUIDE_Test.csv

sampling:
  fraction: 0.05
  seed: 42

features:
  entity_columns:
    - DeviceId
    - Sha256
    - IpAddress
    - Url
    - AccountSid
    - AccountUpn
    - AccountObjectId
    - AccountName
    - DeviceName
    - NetworkMessageId
    - RegistryKey
    - ApplicationId
    - FileName
    - FolderPath
  category_columns:
    - Category
    - EntityType
    - EvidenceRole
    - SuspicionLevel
    - LastVerdict
    - ResourceType
    - OSFamily

split:
  train_frac: 0.70
  valid_frac: 0.15

model:
  seed: 42
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 50

# Illustrative assumptions, in arbitrary cost points per incident.
# Rows are the true grade, columns are what the model decides.
# Predicting TruePositive means escalate, BenignPositive means review later,
# FalsePositive means dismiss.
cost:
  TruePositive:
    TruePositive: 0
    BenignPositive: 20
    FalsePositive: 50
  BenignPositive:
    TruePositive: 2
    BenignPositive: 0
    FalsePositive: 1
  FalsePositive:
    TruePositive: 2
    BenignPositive: 1
    FalsePositive: 0