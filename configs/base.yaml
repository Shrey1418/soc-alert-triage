paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  artifacts_dir: artifacts

data:
  train_file: GUIDE_Train.csv
  test_file: GUIDE_Test.csv

sampling:
  fraction: 0.05
  seed: 42

features:
  entity_columns:
    - DeviceId
    - Sha256
    - IpAddress
    - Url
    - AccountSid
    - AccountUpn
    - AccountObjectId
    - AccountName
    - DeviceName
    - NetworkMessageId
    - RegistryKey
    - ApplicationId
    - FileName
    - FolderPath
  category_columns:
    - Category
    - EntityType
    - EvidenceRole
    - SuspicionLevel
    - LastVerdict
    - ResourceType
    - OSFamily

split:
  train_frac: 0.70
  valid_frac: 0.15